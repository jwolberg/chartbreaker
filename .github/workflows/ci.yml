# CI for the ChartBreaker platform (Python 3.10). The `quality` job runs on
# every push/PR (fast, free): it installs the pinned runtime + dev deps, runs
# the ruff lint + format gate (config in ruff.toml, version pinned in
# requirements-dev.txt), then the pytest suite plus a package-import smoke
# check. There is no type-check gate yet.
#
# The `eval` job is a placeholder for a DETERMINISTIC, zero-tolerance gate
# (correctness/safety/spec assertions) — keep it separate from `quality` and
# wire it only if the project has such a suite. It's commented out by default.
# (The live-target regression gate lives in regression-gate.yml, not here.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests
        run: python -m pytest chartbreaker/tests/ -q
      - name: Import smoke check
        run: python -c "import chartbreaker.cli, chartbreaker.agents.red_team_lead"

  # Deterministic eval / spec-compliance gate (optional — uncomment + adapt).
  # Separate from `quality` so a soft lint failure and a hard correctness
  # failure are distinguishable. Zero-tolerance: any failing assertion fails CI.
