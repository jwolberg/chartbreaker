        "key_changes": [],
        "medications": [],
        "allergies": [],
        "recent_labs": [],
        "missing_data": [],
        "warnings": [],
        "sources": [],
        "confidence_notes": []
      }
    expected_judge_verdict:
      verifier_replay: fail
      semantic: fail
      severity: high

